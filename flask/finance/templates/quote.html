{% extends "layout.html" %}

{% block title %}
    Quote
{% endblock %}

{% block main %}
    <form action="/quote" method="POST">
        <div class="mb-3">
            <input autocomplete="off" autofocus class="form-control mx-auto w-auto" name="symbol" placeholder="Username" type="text">
        </div>
        <button class="btn btn-primary" type="submit">Search</button>
    </form>

    <!-- Tabela so fica vizivel após pesquisa -->
    {% if show_table %}
        <h2>Resumo da ação</h2>
        <table class="table table-striped table-bordered text-center">
            <thead class="table-dark">
                <tr>
                    <th  scope="col">Name</th>
                    <th  scope="col">Symbol</th>
                    <th  scope="col">Price</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>{{ name }}</td>
                    <td>{{ symbol }}</td>
                    <td>{{ price | usd }}</td>
                </tr>
            </tbody>
        </table>
    {% endif %}
{% endblock %}
